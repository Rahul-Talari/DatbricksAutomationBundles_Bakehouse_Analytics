# This is a Databricks asset bundle definition for BakehouseAnalytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: BakehouseAnalytics
  uuid: 9fd9982c-8c73-4f7b-bdf9-5eab126e9281

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405606111982198.18.azuredatabricks.net
    variables:
      catalog: bakehouse_analytics_dev
      schema: rnd
  prod:
    mode: production
    workspace:
      host: https://adb-7405606111982198.18.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/towfiq.devx@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/towfiq.devx@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_analytics_dev
      schema: rnd
    permissions:
      - user_name: towfiq.devx@gmail.com
        level: CAN_MANAGE
